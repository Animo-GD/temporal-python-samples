services:
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    
  worker:
    build: ./backend
    command: python worker.py
    environment:
      TEMPORAL_HOST: temporal:7233
    depends_on:
      - temporal
    restart: on-failure

  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      TEMPORAL_HOST: temporal:7233
    ports:
      - "8000:8000"
    depends_on:
      - temporal
    restart: on-failure
  
  frontend:
    build: ./frontend
    ports:
      - "5500:80"